services:
  migrate:
    build:
      context: .
      target: migration
    restart: 'no'

    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}

    depends_on:
      db:
        condition: service_healthy

    command: bunx prisma@6 migrate deploy

  app:
    restart: unless-stopped
    build:
      context: .
      target: runner

    ports:
      - '3000:3000'

    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS}
      SECURE_COOKIES: ${SECURE_COOKIES:-true}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}
      LEGACY_INGEST_TOKEN: ${LEGACY_INGEST_TOKEN:-}
      INVENTORY_WORKER_STALE_AFTER_SECONDS: ${INVENTORY_WORKER_STALE_AFTER_SECONDS:-1200}
      INVENTORY_JOB_RETENTION_DAYS: ${INVENTORY_JOB_RETENTION_DAYS:-7}

    depends_on:
      migrate:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(()=>process.exit(0),()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  scheduler:
    build:
      context: .
      dockerfile: scheduler.Dockerfile

    restart: unless-stopped

    depends_on:
      app:
        condition: service_healthy

    environment:
      TICK_URL: http://app:3000/api/cron/tick
      TICK_INTERVAL_SECONDS: 60
      SCHEDULER_TOKEN: ${SCHEDULER_TOKEN}

  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - netroku-pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  netroku-pgdata:
