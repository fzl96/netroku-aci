services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://netroku:netroku@db:5432/netroku?schema=public
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: netroku-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netroku
      POSTGRES_PASSWORD: netroku
      POSTGRES_DB: netroku
    volumes:
      - netroku-pgdata:/var/lib/postgresql/data

volumes:
  netroku-pgdata:
